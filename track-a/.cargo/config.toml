# Targets the scoring CPU's instruction-set floor: an Intel i5-13500
# (Raptor Lake) has AVX2, FMA and BMI1/BMI2, which is exactly the
# "x86-64-v3" microarchitecture level, and no AVX-512, which is why it is
# v3 and not v4. Images are built on a separate build machine, so this is
# an explicit target rather than `native`: the build machine only has to
# emit these instructions, and the scoring box is what runs them.
# Measured locally at roughly 2x on byte-scanning code
# (research/compiler-flags.md), for zero source lines and no dependency.
[build]
rustflags = ["-C", "target-cpu=x86-64-v3"]
